<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>PEN 15</title>
    <style>
        span.pen {
            display: inline-block;
            font-size: 172px;
            animation: spin 2s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        blink {
            animation: blink 1s steps(1) infinite;
        }

        @keyframes blink {
            50% {
                visibility: hidden;
            }
        }

        #banner {
            width: 468px;
            height: 60px;
            margin: 12px auto;
            border: 3px ridge #C0C0C0;
            background: #000000;
            overflow: hidden;
            text-align: center;
            animation: bannerflash 1.2s steps(1) infinite;
        }

        @keyframes bannerflash {
            0% {
                background: #000000;
            }

            50% {
                background: #400040;
            }
        }

        #banner .line1 {
            font-family: "Comic Sans MS", cursive;
            font-size: 13px;
            color: #00FF00;
            padding-top: 6px;
        }

        #banner .line2 {
            font-family: Impact, "Arial Black", sans-serif;
            font-size: 26px;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #FF0000, #FFFF00, #00FF00, #00FFFF, #FF00FF, #FF0000);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: rainbow 3s linear infinite;
        }

        @keyframes rainbow {
            to {
                background-position: 200% 0;
            }
        }
    </style>
</head>

<body bgcolor="#000080" text="#FFFF00" link="#00FFFF" vlink="#FF00FF">

    <center>

            <font face="Times New Roman" size="7" color="#FF0000"><b>

        <a href="https://umlaut.fyi" target="_blank">
